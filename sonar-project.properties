# Project identity
sonar.projectKey=whatsapp-microservice
sonar.projectName=WhatsApp Microservice
sonar.projectVersion=1.0

# Sources & language
sonar.language=java
sonar.java.source=21
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8

# Compiled output (Gradle default layout)
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.java.libraries=build/libs/*.jar,~/.gradle/caches/**/*.jar

# Test coverage
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions
sonar.exclusions=**/db/changelog/**,**/generated/**,**/*Application.java
sonar.test.exclusions=**/test/resources/**
sonar.coverage.exclusions=**/*Application.java,**/config/**
